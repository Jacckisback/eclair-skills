<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Livelli di maturità"><title>Livelli di maturità</title><rect x="1" y="1" width="1198" height="438" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="40" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A"><tspan x="40" dy="0">Livelli di maturità</tspan></text><rect x="40" y="230" width="262" height="180" rx="14" fill="#16A34A"/><text x="58" y="264" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan x="58" dy="0">1. Workflow</tspan></text><text x="58" y="292" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC"><tspan x="58" dy="0">SKILL.md guida la</tspan><tspan x="58" dy="19">progettazione, verifica le</tspan><tspan x="58" dy="19">interfacce ed evita errori.</tspan><tspan x="58" dy="19">Tutte le 57 skill sono qui.</tspan></text><rect x="320" y="190" width="262" height="220" rx="14" fill="#2563EB"/><text x="338" y="224" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan x="338" dy="0">2. Pacchetto nativo v2</tspan></text><text x="338" y="252" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC"><tspan x="338" dy="0">extension.json valido, codice</tspan><tspan x="338" dy="19">in sola lettura o admin</tspan><tspan x="338" dy="19">protetto, validatore ufficiale</tspan><tspan x="338" dy="19">e test nativi.</tspan></text><rect x="600" y="150" width="262" height="260" rx="14" fill="#EA580C"/><text x="618" y="184" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan x="618" dy="0">3. Motori di business</tspan></text><text x="618" y="212" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC"><tspan x="618" dy="0">Account, POST, transazioni,</tspan><tspan x="618" dy="19">webhook, audit di sicurezza,</tspan><tspan x="618" dy="19">prestazioni,</tspan><tspan x="618" dy="19">backup/ripristino, CI.</tspan></text><rect x="880" y="110" width="262" height="300" rx="14" fill="#7C3AED"/><text x="898" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan x="898" dy="0">4. Produzione</tspan></text><text x="898" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC"><tspan x="898" dy="0">Rilascio limitato,</tspan><tspan x="898" dy="19">monitoraggio, ripristino</tspan><tspan x="898" dy="19">verificato, supervisione,</tspan><tspan x="898" dy="19">conformità legale.</tspan></text><rect x="40" y="140" width="262" height="44" rx="22" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/><text x="171" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#713F12" text-anchor="middle"><tspan x="171" dy="0">📍 Sei qui — Tutte le 57 skill</tspan></text><path d="M171 186 L171 226" stroke="#CA8A04" stroke-width="3" stroke-dasharray="6 5"/></svg>
