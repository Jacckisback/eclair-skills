<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="The 8 families"><title>The 8 families</title><rect x="1" y="1" width="1198" height="468" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="40" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A"><tspan x="40" dy="0">The 8 families</tspan></text><rect x="40" y="80" width="266" height="176" rx="16" fill="#475569"/><text x="60" y="132" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF"><tspan x="60" dy="0">8</tspan></text><text x="60" y="164" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="60" dy="0">Foundations</tspan></text><text x="60" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F1F5F9"><tspan x="60" dy="0">Native v2 contract, tests and</tspan><tspan x="60" dy="19">security</tspan></text><rect x="324" y="80" width="266" height="176" rx="16" fill="#EA580C"/><text x="344" y="132" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF"><tspan x="344" dy="0">10</tspan></text><text x="344" y="164" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="344" dy="0">Commerce Pro</tspan></text><text x="344" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F1F5F9"><tspan x="344" dy="0">Transactional shop and payments,</tspan><tspan x="344" dy="19">designed before deployment</tspan></text><rect x="608" y="80" width="266" height="176" rx="16" fill="#2563EB"/><text x="628" y="132" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF"><tspan x="628" dy="0">7</tspan></text><text x="628" y="164" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="628" dy="0">LMS</tspan></text><text x="628" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F1F5F9"><tspan x="628" dy="0">Courses, enrollments, progress,</tspan><tspan x="628" dy="19">certificates</tspan></text><rect x="892" y="80" width="266" height="176" rx="16" fill="#7C3AED"/><text x="912" y="132" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF"><tspan x="912" dy="0">6</tspan></text><text x="912" y="164" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="912" dy="0">Forum &amp; community</tspan></text><text x="912" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F1F5F9"><tspan x="912" dy="0">Discussions, moderation,</tspan><tspan x="912" dy="19">profiles, notifications</tspan></text><rect x="40" y="274" width="266" height="176" rx="16" fill="#0D9488"/><text x="60" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF"><tspan x="60" dy="0">8</tspan></text><text x="60" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="60" dy="0">Business apps</tspan></text><text x="60" y="384" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F1F5F9"><tspan x="60" dy="0">Bookings, memberships,</tspan><tspan x="60" dy="19">directories, business tools</tspan></text><rect x="324" y="274" width="266" height="176" rx="16" fill="#DB2777"/><text x="344" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF"><tspan x="344" dy="0">7</tspan></text><text x="344" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="344" dy="0">Design &amp; UX</tspan></text><text x="344" y="384" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F1F5F9"><tspan x="344" dy="0">Themes, blocks, accessibility,</tspan><tspan x="344" dy="19">speed</tspan></text><rect x="608" y="274" width="266" height="176" rx="16" fill="#16A34A"/><text x="628" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF"><tspan x="628" dy="0">5</tspan></text><text x="628" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="628" dy="0">SEO, GEO &amp; migration</tspan></text><text x="628" y="384" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F1F5F9"><tspan x="628" dy="0">Indexability, structured data,</tspan><tspan x="628" dy="19">WordPress</tspan></text><rect x="892" y="274" width="266" height="176" rx="16" fill="#0891B2"/><text x="912" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF"><tspan x="912" dy="0">6</tspan></text><text x="912" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="912" dy="0">Integrations &amp;</tspan><tspan x="912" dy="22">automation</tspan></text><text x="912" y="406" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F1F5F9"><tspan x="912" dy="0">APIs, webhooks, email, AI,</tspan><tspan x="912" dy="19">monitoring</tspan></text></svg>
