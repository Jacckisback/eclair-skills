<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Comment fonctionne un skill"><title>Comment fonctionne un skill</title><rect x="1" y="1" width="1198" height="398" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="40" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A"><tspan x="40" dy="0">Comment fonctionne un skill</tspan></text><rect x="40" y="90" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="90" width="200" height="8" rx="4" fill="#2563EB"/><circle cx="74" cy="136" r="20" fill="#2563EB"/><text x="74" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="74" dy="0">1</tspan></text><text x="102" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A"><tspan x="102" dy="0">Demander</tspan></text><text x="58" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="58" dy="0">Vous décrivez le site</tspan><tspan x="58" dy="22">ou la fonction</tspan><tspan x="58" dy="22">souhaitée.</tspan></text><path d="M244 200 l20 0 m-8 -8 l8 8 l-8 8" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="270" y="90" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="270" y="90" width="200" height="8" rx="4" fill="#7C3AED"/><circle cx="304" cy="136" r="20" fill="#7C3AED"/><text x="304" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="304" dy="0">2</tspan></text><text x="332" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A"><tspan x="332" dy="0">Déclencher</tspan></text><text x="288" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="288" dy="0">L’agent charge le</tspan><tspan x="288" dy="22">skill correspondant à</tspan><tspan x="288" dy="22">sa description.</tspan></text><path d="M474 200 l20 0 m-8 -8 l8 8 l-8 8" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="500" y="90" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="500" y="90" width="200" height="8" rx="4" fill="#EA580C"/><circle cx="534" cy="136" r="20" fill="#EA580C"/><text x="534" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="534" dy="0">3</tspan></text><text x="562" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A"><tspan x="562" dy="0">Diagnostiquer</tspan></text><text x="518" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="518" dy="0">Il lit les références</tspan><tspan x="518" dy="22">et vérifie la version</tspan><tspan x="518" dy="22">réelle du CMS et ses</tspan><tspan x="518" dy="22">capacités.</tspan></text><path d="M704 200 l20 0 m-8 -8 l8 8 l-8 8" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="730" y="90" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="730" y="90" width="200" height="8" rx="4" fill="#0D9488"/><circle cx="764" cy="136" r="20" fill="#0D9488"/><text x="764" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="764" dy="0">4</tspan></text><text x="792" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A"><tspan x="792" dy="0">Construire</tspan></text><text x="748" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="748" dy="0">Il écrit le code</tspan><tspan x="748" dy="22">seulement dans</tspan><tspan x="748" dy="22">site/themes ou</tspan><tspan x="748" dy="22">site/extensions.</tspan></text><path d="M934 200 l20 0 m-8 -8 l8 8 l-8 8" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="960" y="90" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="960" y="90" width="200" height="8" rx="4" fill="#16A34A"/><circle cx="994" cy="136" r="20" fill="#16A34A"/><text x="994" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="994" dy="0">5</tspan></text><text x="1022" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A"><tspan x="1022" dy="0">Prouver</tspan></text><text x="978" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="978" dy="0">Il écrit tests</tspan><tspan x="978" dy="22">positifs et de refus,</tspan><tspan x="978" dy="22">valide et mesure. Un</tspan><tspan x="978" dy="22">humain publie.</tspan></text><rect x="40" y="330" width="1120" height="44" rx="12" fill="#DCFCE7"/><text x="600.0" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#166534" text-anchor="middle"><tspan x="600.0" dy="0">✓ Un humain relit et publie</tspan></text></svg>
