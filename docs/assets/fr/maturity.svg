<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Niveaux de maturité"><title>Niveaux de maturité</title><rect x="1" y="1" width="1198" height="438" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="40" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A"><tspan x="40" dy="0">Niveaux de maturité</tspan></text><rect x="40" y="230" width="262" height="180" rx="14" fill="#16A34A"/><text x="58" y="264" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan x="58" dy="0">1. Workflow</tspan></text><text x="58" y="292" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC"><tspan x="58" dy="0">SKILL.md guide la conception,</tspan><tspan x="58" dy="19">vérifie les interfaces et</tspan><tspan x="58" dy="19">évite les erreurs. Les 57</tspan><tspan x="58" dy="19">skills sont à ce niveau.</tspan></text><rect x="320" y="190" width="262" height="220" rx="14" fill="#2563EB"/><text x="338" y="224" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan x="338" dy="0">2. Paquet natif v2</tspan></text><text x="338" y="252" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC"><tspan x="338" dy="0">extension.json valide, code en</tspan><tspan x="338" dy="19">lecture seule ou admin</tspan><tspan x="338" dy="19">protégé, validateur officiel</tspan><tspan x="338" dy="19">et tests natifs.</tspan></text><rect x="600" y="150" width="262" height="260" rx="14" fill="#EA580C"/><text x="618" y="184" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan x="618" dy="0">3. Moteurs métiers</tspan></text><text x="618" y="212" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC"><tspan x="618" dy="0">Comptes, POST, transactions,</tspan><tspan x="618" dy="19">webhooks, audit de sécurité,</tspan><tspan x="618" dy="19">performance,</tspan><tspan x="618" dy="19">sauvegarde/restauration, CI.</tspan></text><rect x="880" y="110" width="262" height="300" rx="14" fill="#7C3AED"/><text x="898" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan x="898" dy="0">4. Production</tspan></text><text x="898" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC"><tspan x="898" dy="0">Déploiement limité,</tspan><tspan x="898" dy="19">monitoring, restauration</tspan><tspan x="898" dy="19">vérifiée, supervision,</tspan><tspan x="898" dy="19">conformité légale.</tspan></text><rect x="40" y="140" width="262" height="44" rx="22" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/><text x="171" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#713F12" text-anchor="middle"><tspan x="171" dy="0">📍 Vous êtes ici — Les 57 skills</tspan></text><path d="M171 186 L171 226" stroke="#CA8A04" stroke-width="3" stroke-dasharray="6 5"/></svg>
