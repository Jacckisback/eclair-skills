 fill="#0F172A"><tspan x="332" dy="0">Activar</tspan></text><text x="288" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="288" dy="0">El agente carga el</tspan><tspan x="288" dy="22">skill que coincide</tspan><tspan x="288" dy="22">con su descripción.</tspan></text><path d="M474 200 l20 0 m-8 -8 l8 8 l-8 8" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="500" y="90" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="500" y="90" width="200" height="8" rx="4" fill="#EA580C"/><circle cx="534" cy="136" r="20" fill="#EA580C"/><text x="534" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="534" dy="0">3</tspan></text><text x="562" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A"><tspan x="562" dy="0">Diagnosticar</tspan></text><text x="518" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="518" dy="0">Lee las referencias y</tspan><tspan x="518" dy="22">comprueba la versión</tspan><tspan x="518" dy="22">real del CMS y sus</tspan><tspan x="518" dy="22">capacidades.</tspan></text><path d="M704 200 l20 0 m-8 -8 l8 8 l-8 8" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="730" y="90" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="730" y="90" width="200" height="8" rx="4" fill="#0D9488"/><circle cx="764" cy="136" r="20" fill="#0D9488"/><text x="764" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="764" dy="0">4</tspan></text><text x="792" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A"><tspan x="792" dy="0">Construir</tspan></text><text x="748" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="748" dy="0">Escribe código solo</tspan><tspan x="748" dy="22">en site/themes o</tspan><tspan x="748" dy="22">site/extensions.</tspan></text><path d="M934 200 l20 0 m-8 -8 l8 8 l-8 8" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="960" y="90" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="960" y="90" width="200" height="8" rx="4" fill="#16A34A"/><circle cx="994" cy="136" r="20" fill="#16A34A"/><text x="994" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="994" dy="0">5</tspan></text><text x="1022" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A"><tspan x="1022" dy="0">Demostrar</tspan></text><text x="978" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#334155"><tspan x="978" dy="0">Escribe pruebas</tspan><tspan x="978" dy="22">positivas y de</tspan><tspan x="978" dy="22">rechazo, valida y</tspan><tspan x="978" dy="22">mide. Una persona</tspan><tspan x="978" dy="22">publica.</tspan></text><rect x="40" y="330" width="1120" height="44" rx="12" fill="#DCFCE7"/><text x="600.0" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#166534" text-anchor="middle"><tspan x="600.0" dy="0">✓ Una persona revisa y publica</tspan></text></svg>
